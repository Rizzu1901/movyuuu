workflows:
  android-workflow:
    name: Build Movy Android App
    max_build_duration: 15
    environment:
      vars:
        PACKAGE_NAME: "com.movy.app"
      android_signing:
        - movy_keystore
      java: 17
    scripts:
      - name: Set up Android SDK
        script: |
          echo "Using Java 17 for compatibility"
      - name: Build release APK
        script: |
          ./gradlew clean assembleRelease
    artifacts:
      - app/build/outputs//*.apk
    publishing:
      email:
        recipients:
          - your.email@example.com